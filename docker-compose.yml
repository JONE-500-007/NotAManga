services:
  # Backend Node.js
  backend:
    container_name: node-backend2
    # file-type (image upload magic-byte validation) requires Node >=22 as
    # of the version with its ASF-parser DoS fixed — keep in sync with
    # node/Dockerfile's base image.
    image: node:22
    working_dir: /app
    volumes:
      - ./node:/app
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: "dev-only-insecure-secret-change-me"
      DB_PASSWORD: "mysqlpass1122"
      GOOGLE_CLIENT_ID: "937184393700-fd6khpjjnrjtvgu17mbjei3sftiln1po.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "http://localhost:5173/api/auth/google/callback"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET}"
      FACEBOOK_REDIRECT_URI: "http://localhost:5173/api/auth/facebook/callback"
      FRONTEND_URL: "http://localhost:5173"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "NotAManga <hello@justsomemanga.com>"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID}"
      R2_ENDPOINT: "${R2_ENDPOINT}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
    command: sh -c "npm install && npm start"
    depends_on:
      - db

  # Frontend React
  frontend:
    container_name: react-frontend2
    image: node:20
    working_dir: /app
    volumes:
      - ./react:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

  # Database PostgreSQL
  db:
    container_name: postgres-db2
    image: postgres:16
    restart: no
    environment:
      POSTGRES_USER: justthisuser
      POSTGRES_PASSWORD: mysqlpass1122
      POSTGRES_DB: my_database
    ports:
      - "5432:5432"
    volumes:
      - D:/DataDocker/postgres2:/var/lib/postgresql/data

  # pgAdmin
  pgadmin2:
    container_name: pgadmin2
    image: dpage/pgadmin4
    restart: no
    ports:
      - "8000:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    volumes:
    - pgadmin_data2:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgadmin_data2: