services:
  backend:
    container_name: node-backend2
    build:
      context: ./node
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET}"
      DB_HOST: db
      DB_USER: justthisuser
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_NAME: my_database
      DB_PORT: 5432
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET}"
      FACEBOOK_REDIRECT_URI: "${FACEBOOK_REDIRECT_URI}"
      FRONTEND_URL: "${FRONTEND_URL}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "${EMAIL_FROM}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID}"
      R2_ENDPOINT: "${R2_ENDPOINT}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db

  frontend:
    container_name: react-frontend2
    build:
      context: ./react
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      # Bound to loopback only — cloudflared runs on this same host and
      # reaches the site via 127.0.0.1, so this isn't needed on any public
      # interface. Without this, anyone who learns the origin's real IP
      # could hit it directly on port 80 and skip Cloudflare entirely (WAF,
      # rate limiting, DDoS protection, etc. all live at the edge).
      - "127.0.0.1:80:80"
    depends_on:
      - backend

  db:
    container_name: postgres-db2
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: justthisuser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: my_database
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin2:
    container_name: pgadmin2
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
    volumes:
      - pgadmin_data2:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data2:
  uploads_data:
