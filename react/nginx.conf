server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS server. Resolving "backend" through a variable
    # (rather than a bare proxy_pass hostname) makes nginx look it up lazily
    # per-request instead of once at startup — otherwise nginx refuses to
    # start at all if the backend container isn't already up and resolvable
    # the instant nginx boots.
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:3000;

    # Vite hashes every filename under /assets/ at build time, so a browser
    # can cache these forever — a new deploy always ships new filenames,
    # never silently reuses a stale one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so the browser picks up the
    # latest hashed asset filenames right after a deploy. This is what
    # stops users from needing a manual hard refresh after an update.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routes like /manga/4 or /admin/categories
    # aren't real files, so hand everything else to index.html and let
    # React Router take over.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
