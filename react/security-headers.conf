# Shared by every location block in nginx.conf via `include` — nginx's
# add_header only inherits from the server block into a location that has
# *no* add_header of its own, and most locations here already set their own
# Cache-Control. Repeating one `include` line per location (rather than the
# headers themselves) keeps this as the single place these get edited.

# Browsers guess a response's content type from its bytes when a script or
# stylesheet's real Content-Type looks wrong — this is what stops a
# JS-sniffed upload (or a route that ever mis-set Content-Type) from being
# executed as one.
add_header X-Content-Type-Options "nosniff" always;

# Nothing on this site is meant to be embedded in another site's <iframe> —
# refusing framing entirely closes off clickjacking (an invisible iframe of
# a logged-in page overlaid with fake buttons) with no functional cost here.
add_header X-Frame-Options "DENY" always;

# Locked to exactly what the app actually loads (checked against
# react/index.html and every src/ file at the time this was written):
#   - script-src 'self' only — the production build is one hashed JS bundle,
#     no inline <script>, so nothing here needs 'unsafe-inline'.
#   - style-src needs 'unsafe-inline' — React's style={{...}} props (tag
#     colors, the reader's --reader-zoom variable, ...) render as inline
#     style attributes, which CSP treats as "inline" the same as a <style>
#     block regardless of how dynamic the value is.
#   - Google Fonts (fonts.googleapis.com serves the CSS, fonts.gstatic.com
#     the actual font files) and Font Awesome's stylesheet+webfonts from
#     cdnjs.cloudflare.com are the only third-party hosts in use.
#   - img-src allows data:/blob: for the cover-crop tool and novel-chapter
#     image previews, which render the in-browser file the user just picked
#     before it's ever uploaded.
#   - connect-src 'self' — the frontend only ever calls its own /api/.
# If you add a new external resource (an embed, a widget, another font
# host, ...) it needs adding here too or the browser will silently block it
# — check the console for "Refused to ..." messages after any such change.
#
# Cloudflare features that inject their own inline <script> (Rocket Loader,
# Email Address Obfuscation) will conflict with script-src here if either is
# turned on for this zone — leave them off, or this policy needs relaxing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Cross-origin links still get an origin (useful for the destination's own
# analytics/referral logic) without leaking the full path+query — e.g. a
# link out from a private manga's detail page won't hand the destination
# that manga's id in the Referer header.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Once a browser has seen this over HTTPS once, it refuses plain HTTP for a
# year — closes the window where a stale bookmark/link over http:// could
# get intercepted before Cloudflare's redirect ever happens. Safe to send
# even though TLS terminates at Cloudflare, not here: the browser enforces
# this against the public hostname regardless of which hop is HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
