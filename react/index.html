<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/uploads/image_icon/icon_web.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sarabun:wght@300;400;500;600;700&family=K2D:ital,wght@0,400;0,500;0,700;1,400&family=Chakra+Petch:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <!--
      Font Awesome Free 7 — a second icon set alongside Material Symbols
      above, for glyphs Material doesn't carry (brand marks especially:
      Discord, X, Facebook, ...). Usage is class-based, not ligature-based
      like Material Symbols:
        <i class="fa-solid fa-heart"></i>      solid
        <i class="fa-regular fa-heart"></i>    outline
        <i class="fa-brands fa-discord"></i>   brand logos
      Browse the catalogue at https://fontawesome.com/icons (filter to
      "Free" — Pro icons render as a blank box on this plan).
    -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>JustSomeManga</title>

    <!--
      The homepage isn't per-request dynamic data like a manga page (see
      node/routes/linkPreview.routes.js for those), so there's nothing to
      look up — these can just ship as static tags in every response,
      bot or browser, with no nginx routing needed. og:url/og:image must be
      absolute per the OG spec, so the domain below is hardcoded; update it
      here if the site ever moves domains.
    -->
    <meta name="description" content="ช่วยด้วยวดวด ผมหายใจไม่อ ใครก็ได้ไไดด้ด้้ ผมติดอยู่ในนี้ ช่วยด้ววววย H2O=น้ำ" />
    <meta property="og:site_name" content="JustSomeManga" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JustSomeManga" />
    <meta property="og:description" content="ช่วยด้วยวดวด ผมหายใจไม่อ ใครก็ได้ไไดด้ด้้ ผมติดอยู่ในนี้ ช่วยด้ววววย H2O=น้ำ" />
    <meta property="og:url" content="https://www.justsomemanga.com/" />
    <meta property="og:image" content="https://www.justsomemanga.com/uploads/image_icon/icon_web.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JustSomeManga" />
    <meta name="twitter:description" content="ช่วยด้วยวดวด ผมหายใจไม่อ ใครก็ได้ไไดด้ด้้ ผมติดอยู่ในนี้ ช่วยด้ววววย H2O=น้ำ" />
    <meta name="twitter:image" content="https://www.justsomemanga.com/uploads/image_icon/icon_web.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
